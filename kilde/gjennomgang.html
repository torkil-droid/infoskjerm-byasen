<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukesgjennomgang infoskjermen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<!-- Bygget av bygg.py fra kilde/. Plakatene tegnes med samme mal og kode som skjermen. -->
<style>
:root{
  /* Layout: venstre liste over punkter, stort arbeidsfelt til høyre for ett punkt om gangen. Laget for TV i møterommet. */
  color-scheme: light;
  --g-bg:#f3f1ec;
  --g-card:#ffffff;
  --g-ink:#17161b;
  --g-dim:#5f5c66;
  --g-rule:#e2dfd8;
  --g-red:#c8102e;      /* kirkens rødfarge, aksent */
  --g-ok:#1f6f5b;       /* godkjent */
  --g-warn:#b26b00;     /* endres */
  --g-no:#8a8790;       /* avvist */
  --g-q:#1b1470;        /* spørsmål */
  --g-display:"Source Serif 4", Georgia, serif;
  --g-body:"Nunito Sans", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--g-bg);color:var(--g-ink);font-family:var(--g-body);font-size:17px;line-height:1.45;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--g-red);outline-offset:2px}

/* Toppfelt */
.g-top{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--g-ink);color:#fff;flex:none;flex-wrap:wrap}
.g-top h1{font:700 22px/1.1 var(--g-display);margin:0}
.g-subtitle{color:#c9c6cf;font-size:15px}
.g-prog{flex:1;min-width:200px;display:flex;align-items:center;gap:12px}
.g-bar{flex:1;height:8px;background:#3a3940;border-radius:8px;overflow:hidden}
.g-bar i{display:block;height:100%;background:#7fd1b3;width:0;transition:width .4s}
.g-prog b{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.g-toplink{color:#fff;font-weight:700;font-size:15px;text-decoration:none;border:1px solid #57555e;border-radius:8px;padding:7px 12px;background:transparent}
.g-toplink:hover{background:#2c2b31}

/* Hoveddel */
.g-layout{flex:1;display:grid;grid-template-columns:minmax(260px,320px) 1fr;min-height:0}
.g-list{overflow:auto;padding:18px 14px 30px 18px;border-right:1px solid var(--g-rule)}
.g-grp{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g-dim);margin:18px 8px 6px}
.g-grp:first-child{margin-top:0}
.g-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;color:var(--g-ink)}
.g-item:hover{background:#e9e6df}
.g-item.g-cur{background:var(--g-card);box-shadow:0 0 0 2px var(--g-ink) inset}
.g-dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--g-dim)}
.g-dot.s-godkjent,.g-dot.s-besvart,.g-dot.s-avklart,.g-dot.s-sett{background:var(--g-ok);border-color:var(--g-ok)}
.g-dot.s-endre{background:var(--g-warn);border-color:var(--g-warn)}
.g-dot.s-avvist{background:var(--g-no);border-color:var(--g-no)}
.g-item span{font-size:15.5px;line-height:1.3}

.g-work{overflow:auto;padding:24px 36px 40px}
.g-card{background:var(--g-card);border-radius:12px;padding:26px 32px;max-width:1500px;box-shadow:0 1px 0 var(--g-rule)}
.g-kick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g-red)}
.g-pill{font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:20px;background:#efece6;color:var(--g-dim)}
.g-pill.s-godkjent,.g-pill.s-besvart,.g-pill.s-avklart,.g-pill.s-sett{background:#dcefe8;color:var(--g-ok)}
.g-pill.s-endre{background:#f6e7cf;color:var(--g-warn)}
.g-pill.s-avvist{background:#ebeaee;color:var(--g-no)}
.g-title{font:700 34px/1.12 var(--g-display);margin:10px 0 14px;text-wrap:balance}
.g-text{font-size:19px;line-height:1.5;max-width:60ch;white-space:pre-line}
.g-prop{margin-top:16px;border-left:5px solid var(--g-q);background:#f1f0f8;padding:12px 18px;border-radius:0 8px 8px 0;font-size:17.5px;max-width:62ch}
.g-prop b{display:block;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--g-q);margin-bottom:2px}
.g-cols{display:grid;grid-template-columns:1fr;gap:28px}
.g-cols.g-withpv{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);align-items:start}

/* Forhåndsvisning: selve skjermplakaten, tegnet med skjermens egen kode */
.g-pv .stage{
  --u:1cqw; /* 1 % av forhåndsvisningens bredde */
{{FARGER}}  border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.g-pvcap{font-size:14px;color:var(--g-dim);margin-top:8px}
.g-pvmiss{aspect-ratio:16/9;border:2px dashed var(--g-rule);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g-dim);text-align:center;padding:20px}

/* Beslutning */
.g-act{margin-top:24px;padding-top:20px;border-top:1px solid var(--g-rule)}
.g-row{display:flex;gap:12px;flex-wrap:wrap}
.g-btn{border:2px solid var(--g-ink);background:#fff;color:var(--g-ink);border-radius:10px;padding:13px 22px;font-size:19px;font-weight:800;min-width:130px}
.g-btn:hover{background:#f2f0ec}
.g-btn:disabled{opacity:.4;cursor:default}
.g-btn.g-go{background:var(--g-ok);border-color:var(--g-ok);color:#fff}
.g-btn.g-go:hover{background:#185a4a}
.g-btn.g-ed{border-color:var(--g-warn);color:var(--g-warn)}
.g-btn.g-no{border-color:var(--g-no);color:var(--g-dim)}
.g-btn.g-on{box-shadow:0 0 0 4px rgba(23,22,27,.18)}
.g-btn.g-opt{font-weight:700;border-color:var(--g-q);color:var(--g-q)}
.g-btn.g-opt.g-on{background:var(--g-q);color:#fff}
.g-btn kbd{font:600 12px var(--g-body);opacity:.65;margin-left:8px;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.g-lbl{display:block;font-weight:800;font-size:14px;margin:20px 0 6px;color:var(--g-dim)}
.g-notat{width:100%;min-height:84px;font:18px/1.45 var(--g-body);border:2px solid var(--g-rule);border-radius:10px;padding:10px 14px;resize:vertical;color:var(--g-ink);background:#fcfbf9}
.g-save{font-size:14px;color:var(--g-dim);margin-top:6px;min-height:20px}
.g-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;max-width:1500px;gap:12px;flex-wrap:wrap}
.g-hint{font-size:14px;color:var(--g-dim)}

/* Oppsummering */
.g-sum table{width:100%;border-collapse:collapse;font-size:16.5px}
.g-sum th{text-align:left;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-dim);padding:8px 10px;border-bottom:2px solid var(--g-ink)}
.g-sum td{padding:10px;border-bottom:1px solid var(--g-rule);vertical-align:top}
.g-sum td:first-child{width:38%}
.g-msg{max-width:720px;margin:60px auto;text-align:center;font-size:19px;color:var(--g-dim)}
.g-msg h2{font:700 30px var(--g-display);color:var(--g-ink)}
.g-warnbox{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5200;border-radius:8px;padding:10px 14px;font-size:15px;margin:0 0 16px;max-width:1500px}

/* Facebook-utkast: slik posten blir seende ut */
.g-fb{background:#fff;border:1px solid var(--g-rule);border-radius:10px;max-width:520px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden}
.g-fbhead{display:flex;gap:10px;align-items:center;padding:12px 14px}
.g-fbav{width:42px;height:42px;border-radius:50%;background:var(--g-red);color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px var(--g-display);flex:none}
.g-fbname{font-weight:800;font-size:15.5px;line-height:1.2}
.g-fbwhen{font-size:13.5px;color:var(--g-dim)}
.g-fbtext{padding:0 14px 12px;font-size:15.5px;line-height:1.42;white-space:pre-wrap}
.g-fbtext mark{background:#ffe08a;border-radius:3px;padding:0 2px}
.g-fbimg{display:block;width:100%;max-height:520px;object-fit:cover;background:#eee}
.g-fbnoimg{aspect-ratio:1.91/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:repeating-linear-gradient(135deg,#f6f4ef 0 14px,#efece6 14px 28px);color:var(--g-dim);font-weight:700}
.g-fbfoot{display:flex;justify-content:space-around;border-top:1px solid var(--g-rule);margin:0 14px;padding:8px 0;color:var(--g-dim);font-weight:700;font-size:14px}
.g-fbmeta{margin-top:12px;display:grid;gap:6px;font-size:16px;max-width:520px}
.g-fbmeta b{display:inline-block;min-width:118px;color:var(--g-dim);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.g-miss{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5200;border-radius:8px;padding:10px 14px;font-size:16px;margin-top:14px;max-width:62ch}
.g-btn.g-wait{border-color:var(--g-q);color:var(--g-q)}
.g-btn.g-wait.g-on{background:var(--g-q);color:#fff}
.g-dot.s-venterpaa{background:#fff;border-color:var(--g-q);box-shadow:inset 0 0 0 3px var(--g-q)}
.g-pill.s-venterpaa{background:#e6e5f3;color:var(--g-q)}
.g-posttekst{width:100%;min-height:160px;font:16px/1.45 var(--g-body);border:2px solid var(--g-rule);border-radius:10px;padding:10px 14px;resize:vertical;color:var(--g-ink);background:#fcfbf9}

@media (max-width:1100px){.g-cols.g-withpv{grid-template-columns:1fr}}
@media (max-width:820px){
  .g-layout{grid-template-columns:1fr}
  .g-list{max-height:34vh;border-right:0;border-bottom:1px solid var(--g-rule)}
  .g-work{padding:18px 16px 30px}
  .g-card{padding:20px}
}
@media (prefers-reduced-motion:reduce){.g-bar i{transition:none}.slide{transition:none}.slide.on .rows li{animation:none}}

/* ===== Plakatmalen fra skjermen (kilde/skjerm.css), uendret ===== */
{{CSS}}
</style>
</head>
<body>
<header class="g-top">
  <div>
    <h1 id="title">Ukesgjennomgang infoskjermen</h1>
    <div class="g-subtitle" id="subtitle">Byåsen kirke · stabsmøtet</div>
  </div>
  <div class="g-prog"><div class="g-bar" aria-hidden="true"><i id="barfill"></i></div><b id="progtxt">Laster…</b></div>
  <a class="g-toplink" id="skjermlenke" href="https://torkil-droid.github.io/infoskjerm-byasen/" target="_blank" rel="noopener">Åpne skjermsiden</a>
  <button class="g-toplink" id="sumbtn" type="button">Oppsummering</button>
</header>
<div class="g-layout">
  <nav class="g-list" id="list" aria-label="Punkter"></nav>
  <main class="g-work" id="work"><div class="g-msg"><h2>Laster punktene…</h2></div></main>
</div>
{{QR}}
<script>
{{MOTOR}}
</script>
<script>
(function(){
  var SECTIONS=[["oppstart","Oppstart"],["sisteblikk","Siste blikk før publisering"],["plakat","Nye plakater til godkjenning"],["facebook","Facebook-poster"],["innboks","Fra skjerminnboksen"],["flagg","Kalenderflagg og spørsmål"],["info","Til orientering"]];
  var STATUSTXT={venter:"Venter",godkjent:"Godkjent",endre:"Endres",avvist:"Avvist",besvart:"Besvart",avklart:"Avklart",sett:"Sett",venterpaa:"Godkjent når det kommer"};
  var MND=["jan.","feb.","mars","apr.","mai","juni","juli","aug.","sep.","okt.","nov.","des."], DG=["søn.","man.","tir.","ons.","tor.","fre.","lør."];
  var items=[], meta={}, cur=0, view="item", db=null, readonly=false, lastErr="";
  var listEl=document.getElementById("list"), workEl=document.getElementById("work");

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function done(it){return it.status && it.status!=="venter";}
  function ymd(s){var a=String(s||"").split("-");return a.length===3?new Date(+a[0],+a[1]-1,+a[2],12):new Date();}

  function renderTop(){
    var n=items.length, d=items.filter(done).length;
    document.getElementById("barfill").style.width=(n?Math.round(100*d/n):0)+"%";
    document.getElementById("progtxt").textContent=n?(d+" av "+n+" behandlet"):"Ingen punkter";
    if(meta.tittel) document.getElementById("title").textContent=meta.tittel;
    if(meta.undertittel) document.getElementById("subtitle").textContent=meta.undertittel;
    if(meta.skjermUrl) document.getElementById("skjermlenke").href=meta.skjermUrl;
  }

  function renderList(){
    var h="";
    SECTIONS.forEach(function(s){
      var its=items.filter(function(it){return it.seksjon===s[0];});
      if(!its.length) return;
      h+='<div class="g-grp">'+esc(s[1])+'</div>';
      its.forEach(function(it){
        var i=items.indexOf(it);
        h+='<button type="button" class="g-item'+(view==="item"&&i===cur?' g-cur':'')+'" data-i="'+i+'"><i class="g-dot s-'+esc(it.status||"venter")+'" aria-hidden="true"></i><span>'+esc(it.tittel)+'</span></button>';
      });
    });
    listEl.innerHTML=h||'<div class="g-grp">Ingen punkter</div>';
  }

  // Selve skjermplakaten, tegnet med samme kode som skjermen
  function manglerAv(it){
    var m=(it.mangler||[]).slice(), re=/\[mangler:\s*([^\]]*)\]/gi, x;
    while((x=re.exec(it.postTekst||""))) if(m.indexOf(x[1].trim())<0) m.push(x[1].trim());
    if(!it.bilde&&!it.utenBilde&&m.indexOf("bilde")<0) m.push("bilde");
    return m;
  }
  function naar(iso){
    if(!iso) return "tidspunkt ikke satt";
    var d=new Date(iso); if(isNaN(d)) return iso;
    return DG[d.getDay()]+" "+d.getDate()+". "+MND[d.getMonth()]+" kl. "+String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0");
  }
  function fbPreview(it){
    var t=esc(it.postTekst||"").replace(/\[mangler:[^\]]*\]/gi,function(m){return "<mark>"+m+"</mark>";});
    var img=it.bilde?'<img class="g-fbimg" src="'+esc(it.bilde)+'" alt="Bildet til posten">':
      (it.utenBilde?"":'<div class="g-fbnoimg">Bilde mangler'+(it.bildeForslag?'<br>Forslag: '+esc(it.bildeForslag):"")+'</div>');
    var fr=it.fremheving;
    return '<div class="g-pv"><div class="g-fb"><div class="g-fbhead"><div class="g-fbav" aria-hidden="true">BK</div><div><div class="g-fbname">Byåsen kirke</div><div class="g-fbwhen">Planlagt · '+esc(naar(it.publiser))+'</div></div></div>'+
      '<div class="g-fbtext">'+t+'</div>'+img+'<div class="g-fbfoot" aria-hidden="true"><span>Liker</span><span>Kommenter</span><span>Del</span></div></div>'+
      '<div class="g-fbmeta"><div><b>Publiseres</b>'+esc(naar(it.publiser))+'</div>'+
      '<div><b>Fremheving</b>'+(fr&&fr.belop_kr?esc(fr.belop_kr+" kr i "+fr.dager+(fr.dager==1?" dag":" dager")+" · "+(fr.malgruppeNavn||fr.malgruppe||"")):"Ingen, bare vanlig post")+'</div></div></div>';
  }

  function preview(it){
    if(it.type==="facebook") return fbPreview(it);
    var p=it.plakat; if(!p||!p.nokkel) return "";
    var now=ymd(p.dato||meta.dato), html=Skjerm.slide(p.nokkel,now);
    if(!html) return '<div class="g-pv"><div class="g-pvmiss">Fant ikke plakaten «'+esc(p.nokkel)+'» i skjermens kode.</div></div>';
    html=html.replace('<section class="slide','<section class="slide on');
    return '<div class="g-pv"><div class="stage'+(/^stille/.test(p.nokkel)?' stillemodus':'')+'">'+html+'<div class="dots"><i class="done"></i><i class="done"></i><i class="done"></i><i></i><i></i><i></i><i></i></div>'+
      '<div class="foot'+(Skjerm.hast(now)?' hast':'')+'"><span class="lbl">'+(Skjerm.hast(now)?'Viktig beskjed':'Neste i kirka')+'</span><span class="next">'+esc(Skjerm.hast(now)||Skjerm.nextText(now))+'</span><span class="today">'+esc(Skjerm.dLong(now))+'</span></div></div>'+
      '<div class="g-pvcap">Slik ser plakaten ut på skjermen '+esc(Skjerm.dLong(now).toLowerCase())+'.</div></div>';
  }

  function decisionButtons(it){
    var s=it.status||"venter", h='<div class="g-row">';
    if(it.type==="sporsmal"){
      (it.valg||[]).forEach(function(v,k){
        h+='<button type="button" class="g-btn g-opt'+(it.svar===v?' g-on':'')+'" data-svar="'+esc(v)+'">'+esc(v)+'<kbd>'+(k+1)+'</kbd></button>';
      });
    } else if(it.type==="beslutning"){
      h+='<button type="button" class="g-btn g-go'+(s==="avklart"?' g-on':'')+'" data-st="avklart">Avklart<kbd>G</kbd></button>';
    } else if(it.type==="facebook"){
      var miss=manglerAv(it).length>0;
      h+='<button type="button" class="g-btn g-go'+(s==="godkjent"?' g-on':'')+'" data-st="godkjent"'+(miss?' disabled title="Noe mangler fortsatt"':'')+'>Godkjenn<kbd>G</kbd></button>'+
         (it.seksjon!=="sisteblikk"?'<button type="button" class="g-btn g-wait'+(s==="venterpaa"?' g-on':'')+'" data-st="venterpaa">Godkjenn når det kommer<kbd>V</kbd></button>':'')+
         '<button type="button" class="g-btn g-ed'+(s==="endre"?' g-on':'')+'" data-st="endre">Endre<kbd>E</kbd></button>'+
         '<button type="button" class="g-btn g-no'+(s==="avvist"?' g-on':'')+'" data-st="avvist">Ikke nå<kbd>A</kbd></button>';
    } else if(it.type==="info"){
      h+='<button type="button" class="g-btn g-go'+(s==="sett"?' g-on':'')+'" data-st="sett">Sett<kbd>G</kbd></button>';
    } else {
      h+='<button type="button" class="g-btn g-go'+(s==="godkjent"?' g-on':'')+'" data-st="godkjent">Godkjenn<kbd>G</kbd></button>'+
         '<button type="button" class="g-btn g-ed'+(s==="endre"?' g-on':'')+'" data-st="endre">Endre<kbd>E</kbd></button>'+
         '<button type="button" class="g-btn g-no'+(s==="avvist"?' g-on':'')+'" data-st="avvist">Avvis<kbd>A</kbd></button>';
    }
    if(s!=="venter") h+='<button type="button" class="g-btn" data-st="venter">Angre</button>';
    return h+'</div>';
  }

  function renderItem(){
    if(!items.length){
      workEl.innerHTML='<div class="g-msg"><h2>Ingen punkter ennå</h2><p>Claude legger inn ukesforslaget før møtet.</p>'+(lastErr?'<p>'+esc(lastErr)+'</p>':'')+'</div>';
      return;
    }
    if(cur>=items.length) cur=items.length-1;
    var it=items[cur], s=it.status||"venter", sec=SECTIONS.filter(function(x){return x[0]===it.seksjon;})[0];
    var notelabel=it.type==="sporsmal"?"Annet svar eller kommentar":it.type==="beslutning"?"Hva ble bestemt?":(it.type==="facebook"&&s==="venterpaa")?"Hva venter vi på, og fra hvem? (f.eks. «bilde fra Lin-Silvia»)":"Kommentar eller endring";
    var fbmiss=it.type==="facebook"?manglerAv(it):[];
    var pv=preview(it);
    var h=(readonly?'<div class="g-warnbox">Du kan se punktene, men ikke lagre. Be Torkil gi deg redigeringstilgang.</div>':'')+
      '<article class="g-card"><div class="g-kick">'+esc(sec?sec[1]:"")+'<span class="g-pill s-'+esc(s)+'">'+esc(STATUSTXT[s]||s)+'</span></div>'+
      '<h2 class="g-title">'+esc(it.tittel)+'</h2><div class="g-cols'+(pv?' g-withpv':'')+'">'+pv+'<div>'+
      '<div class="g-text">'+esc(it.tekst)+'</div>'+
      (it.forslag?'<div class="g-prop"><b>Claudes forslag</b>'+esc(it.forslag)+'</div>':'')+
      (fbmiss.length?'<div class="g-miss"><b>Mangler:</b> '+esc(fbmiss.join(", "))+'. Fyll inn i teksten under, eller velg «Godkjenn når det kommer».</div>':'')+
      (it.type==="facebook"?'<label class="g-lbl" for="posttekst">Teksten i posten (kan rettes her)</label><textarea class="g-posttekst" id="posttekst">'+esc(it.postTekst||"")+'</textarea>':'')+
      '</div></div>'+
      '<div class="g-act">'+decisionButtons(it)+
      '<label class="g-lbl" for="notat">'+esc(notelabel)+'</label><textarea class="g-notat" id="notat" placeholder="Skriv her, det lagres av seg selv">'+esc(it.notat||"")+'</textarea><div class="g-save" id="save" aria-live="polite"></div></div></article>'+
      '<div class="g-nav"><button type="button" class="g-btn" id="prev"'+(cur===0?' disabled':'')+'>← Forrige</button><span class="g-hint">Går videre av seg selv etter hver beslutning · '+(cur+1)+' av '+items.length+'</span>'+
      '<button type="button" class="g-btn" id="next">'+(cur===items.length-1?'Til oppsummering →':'Neste →')+'</button></div>';
    workEl.innerHTML=h;
    var ta=document.getElementById("notat"), t=null;
    ta.addEventListener("input",function(){clearTimeout(t);setSave("Skriver…");t=setTimeout(function(){write(it.id,{notat:ta.value});},900);});
    ta.addEventListener("blur",function(){clearTimeout(t);if((it.notat||"")!==ta.value) write(it.id,{notat:ta.value});});
    var pt=document.getElementById("posttekst"), t2=null;
    if(pt){
      // En godkjent post som rettes, må godkjennes på nytt
      var lagre=function(){if((it.postTekst||"")===pt.value) return; it.postTekst=pt.value; var p={postTekst:pt.value}; if(it.status==="godkjent"){p.status="venter";it.status="venter";} write(it.id,p);};
      pt.addEventListener("input",function(){clearTimeout(t2);setSave("Skriver…");t2=setTimeout(lagre,1200);});
      pt.addEventListener("blur",function(){clearTimeout(t2);lagre();render();});
    }
  }

  function renderSum(){
    var h='<article class="g-card g-sum"><div class="g-kick">Oppsummering</div><h2 class="g-title">'+items.filter(done).length+' av '+items.length+' punkter er behandlet</h2>'+
      '<p class="g-text">Etter møtet leser Claude beslutningene herfra og retter det som skal endres. Godkjente plakater kommer på skjermen samme dag. Godkjente Facebook-poster legges i køen og publiseres på tidspunktet som står på dem.</p>'+
      '<table><thead><tr><th>Punkt</th><th>Status</th><th>Svar og kommentar</th></tr></thead><tbody>';
    items.forEach(function(it,i){
      var s=it.status||"venter";
      h+='<tr><td><button type="button" class="g-item" data-i="'+i+'" style="padding:0"><span>'+esc(it.tittel)+'</span></button></td><td><span class="g-pill s-'+esc(s)+'">'+esc(STATUSTXT[s]||s)+'</span></td><td>'+esc([it.svar,it.notat].filter(Boolean).join(" · "))+'</td></tr>';
    });
    workEl.innerHTML=h+'</tbody></table></article>';
  }

  function render(){renderTop();renderList();if(view==="sum")renderSum();else renderItem();}
  function setSave(t){var e=document.getElementById("save");if(e)e.textContent=t;}

  // Lagring: én skriving om gangen per punkt
  var busy={}, queued={};
  function write(id,patch){
    if(!db||readonly){setSave("Ikke lagret: ingen tilgang til lagring.");return;}
    if(busy[id]){queued[id]=Object.assign(queued[id]||{},patch);return;}
    busy[id]=true;setSave("Lagrer…");
    patch.oppdatert=new Date().toISOString();
    db.doc("punkter/"+id).update(patch).then(function(){setSave("Lagret");},function(e){
      if(e&&e.code==="invalid_argument"){readonly=true;setSave("Ikke lagret: du har bare lesetilgang.");render();}
      else setSave("Ikke lagret. Prøv igjen om litt.");
    }).then(function(){busy[id]=false;if(queued[id]){var q=queued[id];delete queued[id];write(id,q);}});
  }

  function setStatus(st,svar){
    var it=items[cur]; if(!it) return;
    var p={status:st};
    if(svar!==undefined) p.svar=svar;
    if(st==="venter") p.svar="";
    it.status=st; if(p.svar!==undefined) it.svar=p.svar;
    render(); write(it.id,p);
    // Rask gjennomgang: gå videre av seg selv etter en beslutning (ikke ved Angre eller Endre, der skal det skrives en kommentar)
    if(st==="venterpaa"){var ta2=document.getElementById("notat");if(ta2)ta2.focus();}
    if(st!=="venter"&&st!=="endre"&&st!=="venterpaa"){
      var at=cur;
      setTimeout(function(){if(view==="item"&&cur===at){if(cur===items.length-1){view="sum";render();}else go(1);}},450);
    }
  }

  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.i!==undefined){cur=+b.dataset.i;view="item";render();workEl.scrollTop=0;return;}
    if(b.dataset.st){setStatus(b.dataset.st);return;}
    if(b.dataset.svar!==undefined){setStatus("besvart",b.dataset.svar);return;}
    if(b.id==="prev"){go(-1);return;}
    if(b.id==="next"){if(cur===items.length-1){view="sum";render();}else go(1);return;}
    if(b.id==="sumbtn"){view=view==="sum"?"item":"sum";render();}
  });
  function go(d){cur=Math.max(0,Math.min(items.length-1,cur+d));view="item";render();workEl.scrollTop=0;}
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="TEXTAREA"){if(e.key==="Escape")e.target.blur();return;}
    var fbIt=items[cur];
    if(fbIt&&view==="item"&&fbIt.type==="facebook"){
      if(e.key==="g"||e.key==="G"){if(!manglerAv(fbIt).length)setStatus("godkjent");return;}
      if((e.key==="v"||e.key==="V")&&fbIt.seksjon!=="sisteblikk"){setStatus("venterpaa");e.preventDefault();return;}
      if(e.key==="e"||e.key==="E"){setStatus("endre");var n=document.getElementById("notat");if(n)n.focus();e.preventDefault();return;}
      if(e.key==="a"||e.key==="A"){setStatus("avvist");return;}
    }
    var it=items[cur];
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();go(1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();go(-1);}
    else if(!it||view!=="item") return;
    else if((e.key==="g"||e.key==="G")&&it.type!=="sporsmal"){setStatus(it.type==="beslutning"?"avklart":it.type==="info"?"sett":"godkjent");}
    else if((e.key==="e"||e.key==="E")&&it.type==="plakat"){setStatus("endre");var ta=document.getElementById("notat");if(ta)ta.focus();e.preventDefault();}
    else if((e.key==="a"||e.key==="A")&&it.type==="plakat"){setStatus("avvist");}
    else if(it.type==="sporsmal"&&/^[1-9]$/.test(e.key)){var v=(it.valg||[])[+e.key-1];if(v!==undefined)setStatus("besvart",v);}
  });

  // Data
  renderTop();
  var timer=setTimeout(function(){if(!items.length){lastErr="Får ikke kontakt med lagringen ennå. Sjekk nettet, eller at du er logget inn på claude.ai.";renderItem();}},10000);
  if(!window.claude||!window.claude.use){lastErr="Siden må åpnes via claude.ai for å vise og lagre punktene.";renderItem();return;}
  window.claude.use("db").then(function(d){
    db=d;
    if(!db){clearTimeout(timer);lastErr="Lagringen er ikke tilgjengelig. Logg inn på claude.ai og åpne siden på nytt.";renderItem();return;}
    db.doc("moter/aktiv").onSnapshot(function(s){
      meta=s.exists?(s.data()||{}):{};
      if(document.activeElement&&/^(notat|posttekst)$/.test(document.activeElement.id)) renderTop(); else render();
    },function(){});
    db.collection("punkter").orderBy("rekkefolge").onSnapshot(function(snap){
      if(!snap.metadata.fromCache) clearTimeout(timer);
      var active=document.activeElement&&/^(notat|posttekst)$/.test(document.activeElement.id);
      items=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o;});
      if(active){renderTop();renderList();}else render();
    },function(e){clearTimeout(timer);lastErr="Kunne ikke hente punktene ("+(e&&e.code||"ukjent feil")+").";renderItem();});
  },function(){clearTimeout(timer);lastErr="Lagringen er ikke tilgjengelig.";renderItem();});
})();
</script>
</body>
</html>
