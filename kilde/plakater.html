<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alle plakater – infoskjermen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<!-- Bygget av bygg.py fra kilde/plakater.html. Alle plakater som ligger inne, med når de etter planen vises. -->
<style>
:root{
{{FARGER}}
  --o-bg:#f3f1ec; --o-card:#fff; --o-dim:#5f5c66; --o-rule:#e2dfd8; --o-ok:#1f6f5b; --o-warn:#b26b00;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--o-bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
header h1{font:700 24px/1.1 var(--display);margin:0}
header p{margin:0;color:#c9c6cf;font-size:15px}
header a{color:#fff;font-weight:700;font-size:15px;border:1px solid #57555e;border-radius:8px;padding:7px 12px;text-decoration:none;margin-left:auto}
main{padding:20px 28px 50px;max-width:1700px}
h2.grp{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--o-dim);margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px}
.card{background:var(--o-card);border-radius:12px;padding:14px;box-shadow:0 1px 0 var(--o-rule)}
.card h3{font:700 20px/1.2 var(--display);margin:12px 4px 4px}
.meta{margin:0 4px;font-size:15.5px;color:var(--o-dim)}
.meta b{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:20px;background:#efece6;color:var(--o-dim);margin-right:6px}
.pill.na{background:#dcefe8;color:var(--o-ok)}
.pill.ut{background:#f6e7cf;color:var(--o-warn)}
.tom{color:var(--o-dim)}
{{CSS}}
.pv .stage{--u:1cqw;box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:6px}
.pv .slide{opacity:1}
.pv .foot{justify-content:flex-start}
@media (max-width:600px){main{padding:16px}.grid{grid-template-columns:1fr}header{padding:14px 16px}}
@media (prefers-reduced-motion:reduce){.slide.on .rows li{animation:none}}
</style>
</head>
<body>
<header>
  <div><h1>Alle plakater på infoskjermen</h1><p id="sub">Byåsen kirke</p></div>
  <a href="./" target="_blank" rel="noopener">Åpne skjermen</a>
</header>
<main id="main"><p class="tom">Regner ut planen…</p></main>
{{QR}}
<script>
{{MOTOR}}
</script>
<script>
(function(){
  var MND=["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
  var DAGER=120;
  var q=(location.search.match(/[?&]dato=(\d{4}-\d\d-\d\d)/)||[])[1];
  var fra=q?new Date(+q.slice(0,4),+q.slice(5,7)-1,+q.slice(8,10)):new Date();
  fra=new Date(fra.getFullYear(),fra.getMonth(),fra.getDate());
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function dag(d){return d.getDate()+". "+MND[d.getMonth()];}
  function spenn(a,b){return a.getTime()===b.getTime()?dag(a):(a.getMonth()===b.getMonth()?a.getDate()+".–"+dag(b):dag(a)+" – "+dag(b));}
  function perioder(L){ // sammenhengende dager slås sammen
    var out=[];L.forEach(function(x){var s=out[out.length-1];
      if(s&&(x.d-s.til)/864e5<=1.01&&s.s===x.s){s.til=x.d;} else out.push({fra:x.d,til:x.d,s:x.s});});
    return out;
  }
  document.getElementById("sub").textContent="Plan beregnet fra "+dag(fra)+" "+fra.getFullYear()+" og "+DAGER/30+" måneder fram, etter rundereglene. Datoene er anslag: de kan flytte seg når nye plakater kommer til.";
  setTimeout(function(){
    var P=Skjerm.plan(fra,DAGER), nokler=Object.keys(P), grupper={na:[],kommer:[],ingen:[],utkast:[]};
    nokler.forEach(function(k){
      var inf=Skjerm.info(k); if(!inf) return;
      var L=P[k], c={k:k,inf:inf,L:L};
      if(inf.utkast) grupper.utkast.push(c);
      else if(L.length&&L[0].d.getTime()-fra.getTime()<864e5) grupper.na.push(c);
      else if(L.length) grupper.kommer.push(c);
      else grupper.ingen.push(c);
    });
    grupper.kommer.sort(function(a,b){return a.L[0].d-b.L[0].d;});
    grupper.utkast.sort(function(a,b){return (a.inf.dato||0)-(b.inf.dato||0);});
    function kort(c){
      var inf=c.inf, L=c.L, vis=L.length?L[0].d:fra, tekst;
      if(inf.utkast){
        var anslag="";
        if(inf.dato){var f=new Date(inf.dato.getFullYear(),inf.dato.getMonth(),inf.dato.getDate()-inf.dager);
          if(f<fra) f=fra; vis=new Date(f.getFullYear(),f.getMonth(),f.getDate(),12);
          anslag=" Hvis den godkjennes, vises den etter planen "+spenn(new Date(f.getFullYear(),f.getMonth(),f.getDate()),new Date(inf.dato.getFullYear(),inf.dato.getMonth(),inf.dato.getDate()))+".";}
        tekst='<span class="pill ut">Utkast</span>Venter på godkjenning i stabsmøtet.'+anslag;
      } else if(L.length){
        var slutt=new Date(fra.getFullYear(),fra.getMonth(),fra.getDate()+DAGER-1,12);
        tekst=perioder(L).map(function(p){return '<b>'+(p.til.getTime()===slutt.getTime()?"fra "+dag(p.fra)+" og utover":spenn(p.fra,p.til))+'</b>'+(p.s==="omgang"?" (på omgang)":"");}).join(", ");
        tekst=(c.L[0].d.getTime()-fra.getTime()<864e5?'<span class="pill na">Vises nå</span>':'')+"Vises "+tekst+".";
      } else tekst="Ikke med i runden de neste "+DAGER/30+" månedene"+(inf.til&&inf.til<fra?" (utløpt "+dag(inf.til)+")":"")+".";
      var d=new Date(vis.getFullYear(),vis.getMonth(),vis.getDate(),12);
      var h=c.k.indexOf("liste:")===0?Skjerm.slide(c.k,d):Skjerm.slide(c.k,d);
      return '<article class="card"><div class="pv"><div class="stage">'+h+'<div class="foot"><span class="lbl">Neste i kirka</span></div></div></div>'+
        '<h3>'+esc(inf.tittel)+(inf.dato?' · '+dag(inf.dato):'')+'</h3><p class="meta">'+esc(inf.type)+'. '+tekst+'</p></article>';
    }
    var navn={na:"Vises nå",kommer:"Kommer",utkast:"Utkast som venter på godkjenning",ingen:"Ligger inne, men vises ikke de neste månedene"};
    var html="";
    ["na","kommer","utkast","ingen"].forEach(function(g){ if(grupper[g].length) html+='<h2 class="grp">'+navn[g]+' ('+grupper[g].length+')</h2><div class="grid">'+grupper[g].map(kort).join("")+'</div>'; });
    document.getElementById("main").innerHTML=html||'<p class="tom">Ingen plakater.</p>';
  },30);
})();
</script>
</body>
</html>
