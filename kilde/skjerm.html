<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infoskjerm Byåsen kirke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<!-- Bygget av bygg.py fra kilde/. Ikke rediger denne fila direkte. -->
<style>
:root{
  /* Layout: én 16:9-flate som fyller skjermen. */
  --u:min(1vw,1.7778vh); /* 1 % av plakatflatens bredde; erstatter cqw som Tizen-nettleseren ikke støtter */
{{FARGER}}}
*{box-sizing:border-box}
html,body{margin:0;background:#000;font-family:var(--body);overflow:hidden}
.wrap{height:100vh;display:flex;align-items:center;justify-content:center}
{{CSS}}
.stage{width:min(100vw,177.78vh);border-radius:0;box-shadow:none}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .rows li{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div id="slides"></div>
    <div class="dots" id="dots"></div>
    <div class="foot"><span class="lbl">Neste i kirka</span><span class="next" id="next"></span><span class="today" id="today"></span></div>
  </div>
</div>
{{QR}}
<script>
{{MOTOR}}
</script>
<script>
(function(){
  var DUR=10000, stage=document.getElementById("stage"), box=document.getElementById("slides"), dots=document.getElementById("dots");
  var i=0, timer=null, count=0;
  stage.style.setProperty("--dur",DUR+"ms");
  function show(k){
    if(!count) return;
    i=(k+count)%count;
    var s=box.children, d=dots.children;
    for(var j=0;j<count;j++){s[j].classList.toggle("on",j===i);d[j].className=j<i?"done":"";}
    void d[i].offsetWidth; d[i].className="now";
    clearTimeout(timer); timer=setTimeout(function(){show(i+1);},DUR);
  }
  function render(now){
    var r=Skjerm.build(now);
    count=r.slides.length;
    box.innerHTML=count?r.slides.join(""):'<div class="empty">Ingen kommende arrangementer er lagt inn</div>';
    dots.innerHTML=new Array(count+1).join("<i></i>");
    document.getElementById("next").textContent=r.next;
    document.getElementById("today").textContent=Skjerm.dLong(now);
    show(0);
  }
  // Tegn på nytt hvert kvarter, så utløpte plakater forsvinner av seg selv
  render(new Date());
  setInterval(function(){render(new Date());},15*60*1000);
})();
</script>
</body>
</html>
