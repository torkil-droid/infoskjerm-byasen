<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infoskjerm Byåsen kirke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<!-- Bygget av bygg.py fra kilde/. Ikke rediger denne fila direkte. -->
<style>
:root{
  /* Layout: én 16:9-flate som fyller skjermen. */
  --u:min(1vw,1.7778vh); /* 1 % av plakatflatens bredde; erstatter cqw som Tizen-nettleseren ikke støtter */
  --paper:#ffffff;       /* skjermflaten */
  --ink:#16151a;
  --dim:#5d5b63;
  --rule:#e4e2dd;
  --gud:#c8102e;         /* gudstjenester: kirkens rødfarge */
  --kons:#1b1470;        /* konsert og kultur */
  --barn:#e9a100;        /* barn og familier */
  --mote:#1f6f5b;        /* møteplasser */
  --advent:#5b2a86;      /* kirkeårets farge i advent */
  --display:"Source Serif 4", Georgia, serif;
  --body:"Nunito Sans", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;font-family:var(--body);overflow:hidden}
.wrap{height:100vh;display:flex;align-items:center;justify-content:center}
/* ---------- Skjermen ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);color:var(--ink);
  container-type:inline-size;overflow:hidden;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0 0 calc(7*var(--u)) 0;display:flex;opacity:0;transition:opacity .7s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}

/* Samleside */
.panel{flex:0 0 33%;position:relative;background:var(--c);color:var(--on,#fff);padding:calc(4.2*var(--u)) calc(5*var(--u)) calc(4.2*var(--u)) calc(3.4*var(--u));display:flex;flex-direction:column;gap:calc(1.2*var(--u));
  clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.panel::before{content:"";position:absolute;right:calc(-9*var(--u));top:calc(-9*var(--u));width:calc(24*var(--u));height:calc(24*var(--u));border-radius:50%;background:rgba(255,255,255,.13)}
.kicker{font-size:calc(1.35*var(--u));font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
.panel h2{font-family:var(--display);font-weight:700;font-size:calc(4.6*var(--u));line-height:1.02;margin:0;text-wrap:balance;position:relative}
.panel .sub{font-size:calc(1.7*var(--u));line-height:1.3;margin:0;opacity:.92;max-width:13em}
.panel .mark{position:absolute;left:calc(2.6*var(--u));bottom:calc(2.4*var(--u));width:calc(13*var(--u));height:calc(13*var(--u));opacity:.28}
.mark svg,.ico svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.candles{margin-top:auto;width:calc(15*var(--u))}
.candles svg{display:block;width:100%}
.candles small{display:block;font-size:calc(1.25*var(--u));font-weight:700;margin-top:calc(0.6*var(--u));opacity:.9}
.panel .qr{margin-top:auto;display:flex;align-items:flex-end;gap:calc(1.4*var(--u));position:relative}
.qrbox{background:#fff;padding:calc(0.9*var(--u));border-radius:calc(0.6*var(--u));width:calc(11*var(--u));height:calc(11*var(--u));flex:none}
.qrbox svg{display:block;width:100%;height:100%}
.qrtxt{font-size:calc(1.35*var(--u));line-height:1.3;font-weight:600}
.rows{flex:1;list-style:none;margin:0;padding:calc(2.4*var(--u)) calc(4*var(--u)) calc(2.4*var(--u)) calc(1.6*var(--u));display:flex;flex-direction:column;justify-content:center}
.rows li{display:grid;grid-template-columns:calc(6.4*var(--u)) calc(6.6*var(--u)) 1fr;column-gap:calc(1.3*var(--u));align-items:center;padding:calc(1.3*var(--u)) 0;border-bottom:calc(0.12*var(--u)) solid var(--rule)}
.rows li:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;font-size:calc(4.5*var(--u));line-height:1;text-align:right;color:var(--c);font-variant-numeric:tabular-nums}
.wd{font-size:calc(1.4*var(--u));font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.25}
.wd span{display:block;color:var(--dim);font-weight:600}
.what h3{font-family:var(--display);font-weight:600;font-size:calc(2.4*var(--u));line-height:1.12;margin:0}
.what p{font-size:calc(1.75*var(--u));color:var(--dim);margin:calc(0.45*var(--u)) 0 0}
.what p b{color:var(--c);font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--body);font-size:calc(1.1*var(--u));font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:var(--c);color:#fff;border-radius:calc(10*var(--u));padding:calc(0.25*var(--u)) calc(0.9*var(--u));margin-left:calc(0.8*var(--u));vertical-align:calc(0.4*var(--u))}
.slide.on .rows li{animation:rise .6s both}
.slide.on .rows li:nth-child(2){animation-delay:.08s}.slide.on .rows li:nth-child(3){animation-delay:.16s}
.slide.on .rows li:nth-child(4){animation-delay:.24s}.slide.on .rows li:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(calc(1.2*var(--u)))}to{opacity:1;transform:none}}

/* Fremhevet */
.feat{color:var(--on,#fff);padding:calc(4.4*var(--u)) calc(5*var(--u));gap:calc(4*var(--u));align-items:stretch;
  background:radial-gradient(circle at 86% 4%,rgba(255,255,255,.15) 0 calc(19*var(--u)),transparent calc(19.1*var(--u))),
             radial-gradient(circle at 104% 108%,rgba(0,0,0,.16) 0 calc(30*var(--u)),transparent calc(30.1*var(--u))),var(--c)}
.feat .main{flex:1;display:flex;flex-direction:column}
.chip{display:inline-block;background:#fff;color:var(--ink);font-size:calc(1.25*var(--u));font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:calc(10*var(--u));padding:calc(0.35*var(--u)) calc(1.1*var(--u));margin-left:calc(1*var(--u));opacity:1}
.feat h2{font-family:var(--display);font-weight:700;font-size:calc(7.2*var(--u));line-height:.98;margin:calc(2.4*var(--u)) 0 0;text-wrap:balance}
.feat .lead{font-size:calc(2.5*var(--u));line-height:1.32;max-width:28em;margin:calc(1.8*var(--u)) 0 0}
.feat .place{margin-top:auto;font-size:calc(1.8*var(--u));font-weight:600}
.feat .side{flex:0 0 calc(18*var(--u));display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;text-align:right}
.big b{display:block;font-family:var(--display);font-weight:700;font-size:calc(15*var(--u));line-height:.82;font-variant-numeric:tabular-nums}
.big span{display:block;font-size:calc(3*var(--u));font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:calc(0.8*var(--u))}
.big em{display:block;font-style:normal;font-size:calc(1.8*var(--u));font-weight:600;margin-top:calc(0.5*var(--u))}
.feat .side .qrbox{width:calc(13*var(--u));height:calc(13*var(--u));padding:calc(1*var(--u))}
.feat .side .qrtxt{font-size:calc(1.3*var(--u));margin-top:calc(0.5*var(--u))}

/* Oppslag: beskjed med frist */
.note{background:#f4f1ea;padding:calc(4.4*var(--u)) calc(5*var(--u));gap:calc(4*var(--u));align-items:center;border-left:calc(1.6*var(--u)) solid var(--gud)}
.note .main{flex:1}
.note .kicker{color:var(--gud);opacity:1}
.note h2{font-family:var(--display);font-weight:700;font-size:calc(5.6*var(--u));line-height:1.02;margin:calc(1.4*var(--u)) 0 0;text-wrap:balance}
.note p{font-size:calc(2.5*var(--u));line-height:1.35;margin:calc(1.6*var(--u)) 0 0;max-width:24em}
.note .act{font-weight:800}
.badge{flex:0 0 calc(19*var(--u));height:calc(19*var(--u));border-radius:50%;background:var(--gud);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.badge b{font-family:var(--display);font-size:calc(8.5*var(--u));line-height:.9;font-variant-numeric:tabular-nums}
.badge span{font-size:calc(1.5*var(--u));font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:calc(0.6*var(--u))}

/* Fast innhold: uten dato */
.fast{background:var(--ink);color:#fff;padding:calc(4.4*var(--u)) calc(5*var(--u));gap:calc(4*var(--u));align-items:center}
.fast .main{flex:1}
.fast .kicker{color:#ffb3bd;opacity:1}
.fast h2{font-family:var(--display);font-weight:700;font-size:calc(5.8*var(--u));line-height:1.02;margin:calc(1.4*var(--u)) 0 0;text-wrap:balance}
.fast p{font-size:calc(2.5*var(--u));line-height:1.36;margin:calc(1.6*var(--u)) 0 0;max-width:24em;color:#e6e3dc}
.fast .side{flex:0 0 calc(17*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--u));text-align:center}
.fast .side .qrbox{width:calc(15*var(--u));height:calc(15*var(--u));padding:calc(1.1*var(--u))}
.fast .ico{width:calc(15*var(--u));height:calc(15*var(--u));color:#ffb3bd}
.nytt h2{font-size:calc(4.3*var(--u))}.nytt p{font-size:calc(2.4*var(--u))}.nytt .src{font-size:calc(1.35*var(--u));color:#a9a6b0;margin-top:calc(1.8*var(--u));font-weight:600}
.photo{flex:none;width:calc(24*var(--u));height:calc(30*var(--u));border-radius:calc(0.8*var(--u));border:calc(0.14*var(--u)) dashed #6d6a75;display:flex;align-items:center;justify-content:center;
  font-size:calc(1.3*var(--u));color:#a9a6b0;text-align:center;padding:calc(2*var(--u));
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 calc(1.2*var(--u)),transparent calc(1.2*var(--u)) calc(2.4*var(--u)))}

.photo.img{position:relative;width:calc(30*var(--u));height:calc(24*var(--u));padding:0;border:0;overflow:hidden;background:#000}
.photo.img img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.cred{position:absolute;left:0;right:0;bottom:0;padding:calc(0.5*var(--u)) calc(0.8*var(--u));font-size:calc(1*var(--u));color:#e6e3dc;background:rgba(0,0,0,.55);text-align:left}


/* Illustrasjoner: strek i relieff, samme farge som teksten */
.panel .art{position:absolute;left:calc(2.6*var(--u));bottom:calc(2.4*var(--u));opacity:.3}
.panel .art svg{display:block;width:100%;height:100%}
.panel .art.mote{width:calc(13*var(--u));height:calc(14.4*var(--u))}
.panel .art.barn{width:calc(18*var(--u));height:calc(15*var(--u))}
.feat>.main,.feat>.side{position:relative;z-index:1}
.art-top{position:absolute;left:0;right:0;top:0;height:calc(9*var(--u));pointer-events:none}
.art-fill,.art-bot{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.art-fill{top:0}
.art-krystall{position:absolute;right:calc(-13*var(--u));top:calc(-15*var(--u));width:calc(44*var(--u));height:calc(44*var(--u));pointer-events:none}
.art-krystall svg{display:block;width:100%;height:100%}
.feat.bilde .art-krystall{right:auto;top:auto;left:calc(-8*var(--u));bottom:calc(-14*var(--u))}
.art-bot{height:calc(16*var(--u))}
.art-hj{position:absolute;right:calc(4.6*var(--u));bottom:calc(3.2*var(--u));width:calc(15*var(--u));height:calc(12.8*var(--u));pointer-events:none;opacity:.28}
.art-hj svg{display:block;width:100%;height:100%}
.art-top svg,.art-fill svg,.art-bot svg{display:block;width:100%;height:100%}
.feat.jul{padding-top:calc(9.6*var(--u))}
.feat .prog{list-style:none;margin:calc(1.8*var(--u)) 0 0;padding:0;font-size:calc(2.5*var(--u));line-height:1.2}
.feat .prog li{display:flex;gap:calc(1.2*var(--u));padding:calc(0.2*var(--u)) 0}
.feat .prog b{flex:0 0 calc(8.4*var(--u));font-variant-numeric:tabular-nums;font-weight:800}
.feat.jul .lead{margin-top:calc(1.2*var(--u))}
.feat.jul h2{margin-top:calc(1.6*var(--u))}

/* Fremhevet med bilde */
.feat.bilde .side{flex:0 0 calc(38*var(--u));align-items:stretch;justify-content:flex-start;text-align:left;gap:calc(2*var(--u))}
.feat.bilde h2{font-size:calc(6*var(--u))}
.feat.bilde .lead{font-size:calc(2.3*var(--u))}
.feat .pic{position:relative;width:100%;height:calc(25.3*var(--u));border-radius:calc(0.8*var(--u));overflow:hidden;background:#000}
.feat .pic img{display:block;width:100%;height:100%;object-fit:cover}
.feat .when{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto}
.feat.bilde .big b{font-size:calc(10*var(--u))}
.feat.bilde .big span{font-size:calc(2.2*var(--u))}
.feat.bilde .big em{font-size:calc(1.6*var(--u))}
.feat.bilde .when .qrw{text-align:center}
.feat.bilde .side .qrbox{width:calc(11*var(--u));height:calc(11*var(--u))}

/* Oppslag med illustrasjon */
.note.medart{gap:calc(3*var(--u))}
.nside{position:relative;flex:0 0 calc(36*var(--u));color:var(--gud)}
.nart svg{display:block;width:100%}
.nside .badge{position:absolute;left:50%;top:63.3%;transform:translate(-50%,-50%);width:calc(14*var(--u));height:calc(14*var(--u))}
.nside .badge b{font-size:calc(6.4*var(--u))}
.badge b.txt{font-size:calc(5.4*var(--u))}
.nside .badge b.txt{font-size:calc(3.2*var(--u))}
.nside .badge span{font-size:calc(0.95*var(--u));letter-spacing:.06em;line-height:1.3;margin-top:calc(0.3*var(--u))}

/* Oppslag med relieff i bakgrunnen */
.note .kicker.frist{font-size:calc(2*var(--u));letter-spacing:.02em;text-transform:none;color:var(--gud);font-weight:800}
.note>.main,.note>.nside{position:relative;z-index:1}
.art-tre{position:absolute;top:0;bottom:0;right:calc(1*var(--u));width:calc(52*var(--u));pointer-events:none}
.art-tre svg{display:block;width:100%;height:100%}
.note .nart circle{fill:#f4f1ea}

/* Fast innhold med bilde */
.fast.medbilde .photo.img{width:calc(27*var(--u));height:calc(21.6*var(--u))}
.fast.medbilde .photo.img img{object-position:50% 20%}
.fast.stort .photo.img{width:calc(42*var(--u));height:calc(33.6*var(--u))}
.fast.stort h2{font-size:calc(4.6*var(--u))}
.fast.medbilde h2{font-size:calc(4.3*var(--u))}
.fast.medbilde p{font-size:calc(2.4*var(--u))}
.fast.medbilde .side{flex-basis:calc(15*var(--u))}
.fast.medbilde .side .qrbox{width:calc(13*var(--u));height:calc(13*var(--u))}

/* Fast bunnlinje */
.foot{position:absolute;left:0;right:0;bottom:0;height:calc(7*var(--u));background:var(--ink);color:#fff;display:flex;align-items:center;
  gap:calc(2*var(--u));padding:0 calc(3.4*var(--u));font-size:calc(1.7*var(--u))}
.foot .lbl{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:calc(1.2*var(--u));color:#ffb3bd;flex:none}
.foot .next{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.foot .today{flex:none;opacity:.8}
.foot .logo{flex:none;display:flex;width:calc(5*var(--u));height:calc(4*var(--u));color:#fff;opacity:.9;margin-right:calc(-0.2*var(--u))}
.foot .logo svg{width:100%;height:100%}
.foot.hast{background:var(--gud)}
.foot.hast .lbl{color:#fff}
.foot.hast .next{font-weight:800}
.foot.hast .today{display:none}
.dots{position:absolute;left:0;right:0;bottom:calc(7*var(--u));height:calc(0.5*var(--u));display:flex;gap:calc(0.3*var(--u));background:var(--paper)}
.dots i{flex:1;background:var(--rule);position:relative;overflow:hidden}
.dots i.done{background:var(--ink)}
.dots i.now::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:fill var(--dur) linear forwards}
.paused .dots i.now::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.empty{position:absolute;inset:0 0 calc(7*var(--u)) 0;display:flex;align-items:center;justify-content:center;font-size:calc(2.4*var(--u));color:var(--dim)}

/* ---- Stillemodus: svart, levende lys, de neste gudstjenestene ---- */
.stage.stillemodus{background:#0b0a0d}
.stage.stillemodus .dots,.stage.stillemodus .foot{display:none}
.stille{position:absolute;inset:0;background:#0b0a0d;color:#e9e4da;display:flex;align-items:center;padding:0 calc(9*var(--u)) 0 calc(14*var(--u));gap:calc(12*var(--u))}
.stille .lys{position:relative;flex:none;width:calc(22*var(--u));height:calc(46*var(--u))}
.stille .glod{position:absolute;left:50%;top:calc(3*var(--u));width:calc(44*var(--u));height:calc(44*var(--u));margin-left:calc(-22*var(--u));border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,120,.38) 0,rgba(255,160,70,.14) 28%,rgba(255,140,50,0) 62%);animation:glod 3.1s ease-in-out infinite}
.stille .flamme{position:absolute;left:50%;top:calc(13*var(--u));width:calc(3.4*var(--u));height:calc(9*var(--u));margin-left:calc(-1.7*var(--u));
  border-radius:50% 50% 45% 45% / 70% 70% 30% 30%;transform-origin:50% 92%;
  background:radial-gradient(ellipse at 50% 80%,#fffdf4 0,#fff2c4 22%,#ffcf6a 42%,#ff9a2e 68%,rgba(255,110,20,.0) 100%);
  animation:flamme 2.3s ease-in-out infinite,vipp 3.7s ease-in-out infinite}
.stille .flamme i{position:absolute;left:30%;right:30%;bottom:8%;height:28%;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,rgba(120,160,255,.55),rgba(120,160,255,0) 70%)}
.stille .veke{position:absolute;left:50%;top:calc(21.2*var(--u));width:calc(0.35*var(--u));height:calc(1.6*var(--u));margin-left:calc(-0.175*var(--u));background:#2a2018;border-radius:2px}
.stille .stamme{position:absolute;left:50%;top:calc(22.4*var(--u));width:calc(7.5*var(--u));bottom:0;margin-left:calc(-3.75*var(--u));border-radius:calc(0.8*var(--u)) calc(0.8*var(--u)) 0 0;
  background:linear-gradient(180deg,rgba(11,10,13,0) 0,rgba(11,10,13,.25) 45%,rgba(11,10,13,.92) 100%),
    radial-gradient(ellipse at 50% 0,rgba(255,214,150,.6),rgba(255,214,150,0) 40%),
    linear-gradient(90deg,#8f8574 0,#d8cfbe 30%,#efe7d8 52%,#a99e8a 100%)}
.stille .tekst{flex:1}
.stille .avs{display:flex;align-items:center;gap:calc(1.6*var(--u));color:#a39d92;font-size:calc(1.6*var(--u));font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.stille .avs .fisk{width:calc(5*var(--u));height:calc(4*var(--u))}
.stille h2{font-family:var(--display);font-weight:600;font-size:calc(4.6*var(--u));line-height:1.1;margin:calc(2.2*var(--u)) 0 calc(3*var(--u))}
.stille ol{list-style:none;margin:0;padding:0}
.stille li{padding:calc(1.6*var(--u)) 0;border-top:1px solid rgba(233,228,218,.14)}
.stille li b{display:block;font-family:var(--display);font-weight:600;font-size:calc(2.8*var(--u))}
.stille li span{display:block;color:#a39d92;font-size:calc(2*var(--u));margin-top:calc(.3*var(--u))}
@keyframes flamme{0%,100%{transform:scale(1,1)}20%{transform:scale(.97,1.05)}45%{transform:scale(1.03,.96)}70%{transform:scale(.98,1.08)}85%{transform:scale(1.02,.99)}}
@keyframes vipp{0%,100%{margin-left:calc(-1.7*var(--u))}30%{margin-left:calc(-1.55*var(--u))}60%{margin-left:calc(-1.85*var(--u))}}
@keyframes glod{0%,100%{opacity:1;transform:scale(1)}35%{opacity:.82;transform:scale(.97)}55%{opacity:.95;transform:scale(1.02)}80%{opacity:.86;transform:scale(.99)}}
@media (prefers-reduced-motion:reduce){.stille .flamme,.stille .glod{animation:none}}

.stage{width:min(100vw,177.78vh);border-radius:0;box-shadow:none}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.on .rows li{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  function fristTekst(N,left){
    var u=ymd(N.until), d=u.getDate()+". "+["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"][u.getMonth()];
    return left<=0?"Siste frist for påmelding er i dag":"Påmelding innen "+d;
  }
  function noteSlide(N,now){
    var left=dayDiff(ymd(N.until),now);
    var badge='<div class="badge"><b'+(left<=0?' class="txt"':'')+'>'+(left<=0?"I dag":left)+'</b><span>'+(left<=0?"siste frist<br>for påmelding":(left===1?"dag igjen":"dager igjen")+"<br>å melde seg på")+'</span></div>';
    return '<section class="slide note'+(N.art?' medart':'')+'">'+(N.relieff&&ART[N.relieff]?ART[N.relieff]():'')+'<div class="main"><div class="kicker'+(N.nedtelling?' frist':'')+'">'+esc(N.nedtelling?fristTekst(N,left):(N.kicker||"Påmelding"))+'</div><h2>'+esc(N.title)+'</h2><p>'+esc(N.text)+
      '</p><p class="act">'+esc(N.act)+'</p></div>'+(N.art&&ART[N.art]?'<div class="nside"><div class="nart">'+ART[N.art]()+'</div>'+badge+'</div>':badge)+'</section>';
  }
  function newsSlide(){
    var ph=NEWS.img?'<div class="photo img"><img src="'+esc(NEWS.img)+'" alt=""><span class="cred">'+esc(NEWS.credit||"")+'</span></div>':'<div class="photo">'+esc(NEWS.photo||"")+'</div>';
    return '<section class="slide fast nytt">'+ph+'<div class="main"><div class="kicker">'+esc(NEWS.kicker)+
      '</div><h2>'+esc(NEWS.title)+'</h2><p>'+esc(NEWS.text)+'</p><div class="src">'+esc(NEWS.src)+'</div></div><div class="side">'+
      (qr(NEWS.url)||'<div class="ico">'+icon("globe")+'</div>')+'<div class="qrtxt">Les hele saken</div></div></section>';
  }
  function nesteGang(title,now){
    return E.filter(function(e){return e.title===title&&!e.utkast&&dt(e,e.last).getTime()>now.getTime();})[0];
  }
  function fastSlide(fa,now){
    var kicker=fa.kicker;
    if(fa.neste){var n=nesteGang(fa.neste,now||new Date());if(!n) return "";kicker="Neste gang "+dLong(dt(n)).toLowerCase()+" kl. "+(n.tt||n.t)+(hjemme(n.place)?"":" · "+n.place);}
    var ph=fa.img?'<div class="photo img"><img src="'+esc(fa.img)+'" alt=""><span class="cred">'+esc(fa.credit||"")+'</span></div>':'';
    var side=(fa.img&&!fa.qr)?'':(fa.photo&&!fa.img)?'<div class="photo">'+esc(fa.photo)+'</div>':
      '<div class="side">'+(qr(fa.qr)||'<div class="ico">'+icon("heart")+'</div>')+'<div class="qrtxt">'+esc(fa.qrtxt)+'</div></div>';
    return '<section class="slide fast'+(fa.img?' medbilde':'')+(fa.img&&!fa.qr?' stort':'')+'">'+ph+'<div class="main"><div class="kicker">'+esc(kicker)+'</div><h2>'+esc(fa.title)+'</h2><p>'+esc(fa.text)+
      '</p></div>'+side+'</section>';
  }

  // ---- Regler for runden. Justeres her. ----
  // Bygger på rapporten «Infoskjerm i våpenhuset: anbefalinger for plakater og karusell» (november 2026).
  // Rapporten anbefaler 6–8 plakater, 8–12 s hver og en runde på 60–90 s. Vi bruker den øvre grensen.
  var REGLER={
    maks:8,                 // plakater i runden
    maksSek:90,             // lengste runde i sekunder
    sek:{vanlig:10, lang:12},  // 10 s for en vanlig plakat (≤ 20 ord), 12 s for samlesider, programlister og plakater med QR-kode
    ord:{tittel:7, totalt:20}, // overskrift ≤ 7 ord, hele plakaten ≤ 20 ord, klokkeslett og tall ikke medregnet (sjekk.js)
    fremhevet:{dager:21, konsertDager:42},   // egen plakat fra 3 uker før, konserter med billettsalg fra 6 uker før
    liste:{                 // samlesider: høyst 5 linjer, 3 uker fram (konserter 6 uker)
      gud:{antall:5,dager:21}, barn:{antall:5,dager:21}, mote:{antall:5,dager:21}, kons:{antall:5,dager:42}
    },
    // Tidskritisk: alt som skjer de neste 8 dagene, og påmeldingsfrister de neste 8 dagene, skal stå i hver runde.
    // Trengs det, kan runden da gå opp til 10 plakater og 120 sekunder. Holder ikke det heller, samles
    // arrangementene de neste 8 dagene som ikke har egen plakat, på siden «Denne uka i kirka».
    kritisk:{dager:8, maks:10, maksSek:120},
    // Rekkefølgen plassene fordeles i. Gudstjenester er alltid med.
    prioritet:["gud","feat1","note1","barn","mote","feat2","kons","feat3"]
  };
  function varighet(h){return /^<section class="slide" |qrbox|class="prog"/.test(h)?REGLER.sek.lang:REGLER.sek.vanlig;}

  // ---- Samlesidene for en gitt dato ----
  function lists(now,withDrafts){
    var up=E.filter(function(e){return !e.erstatter&&(withDrafts||!e.utkast)&&dt(e,e.last).getTime()+2*3600e3>now.getTime();}).sort(function(a,b){return dt(a)-dt(b);});
    var days=function(e){return (dt(e)-now)/864e5;};
    var R=REGLER.liste, within=function(k){return function(e){return days(e)<=R[k].dager;};};
    var season=now>=SEASON[0]&&now<SEASON[1], S={}, I={};
    var gudItems=[], gName, gSub, gC, gExtra;
    if(season){
      gudItems=up.filter(function(e){return e.cat==="gud"&&e.jul;}).slice(0,5);
      gName="Advent og jul"; gSub="Gudstjenester fram til 1. juledag"; gC="var(--advent)"; gExtra=candles(now);
    }
    if(!season||!gudItems.length){
      var allGud=up.filter(function(e){return e.cat==="gud";});
      gudItems=allGud.filter(within("gud")).slice(0,R.gud.antall);
      if(!gudItems.length) gudItems=allGud.slice(0,R.gud.antall);
      gName=CAT.gud.name; gSub=CAT.gud.sub; gC=CAT.gud.c; gExtra=mark("gud");
    }
    I.gud=gudItems;
    I.kons=up.filter(function(e){return e.cat==="kons";}).filter(within("kons")).slice(0,R.kons.antall);
    I.barn=up.filter(function(e){return e.cat==="barn"||e.alsoBarn;}).filter(within("barn")).slice(0,R.barn.antall);
    I.mote=up.filter(function(e){return e.cat==="mote"||e.alsoMote;}).filter(within("mote")).slice(0,R.mote.antall);
    var kqr=I.kons.length?qr("https://www.hoopla.no"):"";
    S.gud=listSlide(gName,gSub,gC,null,I.gud,gExtra,now);
    S.barn=listSlide(CAT.barn.name,CAT.barn.sub,CAT.barn.c,CAT.barn.on,I.barn,'<div class="art barn">'+ART.barn()+'</div>',now);
    S.kons=listSlide(CAT.kons.name,CAT.kons.sub,CAT.kons.c,null,I.kons,kqr?'<div class="qr">'+kqr+'<div class="qrtxt">Billetter og<br>mer informasjon</div></div>':mark("kons"),now);
    S.mote=listSlide(CAT.mote.name,CAT.mote.sub,CAT.mote.c,null,I.mote,'<div class="art mote">'+ART.mote()+'</div>',now);
    return {S:S,I:I,up:up,days:days};
  }

  // ---- Hele runden på skjermen ----
  // runde: tellende rundenummer fra skjermsiden. Bestemmer hvem som har plassen som går på omgang.
  function build(now,runde){
    runde=runde||0;
    if(stilleAktiv(now)) return {slides:[],durs:[],omgang:0,next:"",hast:"",stille:stilleSide(now)};
    var L=lists(now,false), S=L.S, RF=REGLER.fremhevet, RK=REGLER.kritisk;
    var snart=function(d){return (d-now)/864e5<=RK.dager;};
    // Fremhevet: alle som er innenfor horisonten, nærmeste først
    var FE=E.filter(function(e){return e.feat&&!e.utkast&&dt(e,e.last).getTime()+2*3600e3>now.getTime()&&L.days(e)<=(e.cat==="kons"?RF.konsertDager:RF.dager);})
            .sort(function(a,b){return dt(a)-dt(b);});
    // Påmeldinger med frist, nærmeste frist først
    var NA=NOTES.filter(function(n){return !n.utkast&&now>=ymd(n.from)&&now<new Date(ymd(n.until).getTime()+86399e3);})
            .sort(function(a,b){return ymd(a.until)-ymd(b.until);});
    // Alle kandidater med nøkkel, innhold og om de er tidskritiske
    var K={}, ekstra=[];
    // Travel uke: flere kandidater enn faste plasser. Da samles konserter som ikke er tidskritiske på
    // konsertsiden i stedet for å få egne plakater, og konsertsiden får plass før egen plakat 2.
    var kandidater=1+FE.length+NA.length+["barn","mote","kons"].filter(function(k){return L.I[k].some(function(e){return FE.indexOf(e)<0;});}).length;
    var konsSamlet=false;
    if(kandidater>REGLER.maks-1){
      var ut=FE.filter(function(e){return e.cat==="kons"&&!snart(dt(e))&&L.I.kons.indexOf(e)>=0;});
      if(ut.length){FE=FE.filter(function(e){return ut.indexOf(e)<0;});konsSamlet=true;}
    }
    var prioritet=konsSamlet?["gud","feat1","note1","barn","mote","kons","feat2","feat3"]:REGLER.prioritet;
    K.gud={h:S.gud,krit:true};
    var AH=aktivHast(now); if(AH) K.hast={h:hastSlide(AH,now),krit:true};
    FE.forEach(function(e,i){K["feat"+(i+1)]={h:featSlide(e,now),krit:snart(dt(e)),e:e}; if(i>=3) ekstra.push("feat"+(i+1));});
    NA.forEach(function(n,i){K["note"+(i+1)]={h:noteSlide(n,now),krit:snart(ymd(n.until))}; if(i>=1) ekstra.push("note"+(i+1));});
    // Samlesider tas bare med når de har noe som ikke allerede har egen plakat
    var rester={};
    ["barn","mote","kons"].forEach(function(k){
      rester[k]=L.I[k].filter(function(e){return FE.indexOf(e)<0;});
      if(rester[k].length) K[k]={h:S[k],krit:rester[k].some(function(e){return snart(dt(e));})};
    });
    var orden=["hast"].concat(prioritet).concat(ekstra).filter(function(k){return K[k];});
    var lengde=function(ks){return ks.reduce(function(a,k){return a+varighet(K[k].h);},0);};
    var krit=orden.filter(function(k){return K[k].krit;});
    var maks=REGLER.maks, maksSek=REGLER.maksSek;
    // For mye tidskritisk for 8 plakater: løft taket til 10 plakater og 120 sekunder
    if(krit.length>maks-1||lengde(krit)>maksSek-REGLER.sek.lang){maks=RK.maks;maksSek=RK.maksSek;}
    // Fortsatt for mye: samle det som skjer de neste 8 dagene, uten egen plakat, på «Denne uka i kirka»
    if(krit.length>maks||lengde(krit)>maksSek){
      var uka=[], ut=[];
      ["barn","mote","kons"].forEach(function(k){ if(K[k]&&K[k].krit){ rester[k].forEach(function(e){if(snart(dt(e))&&uka.indexOf(e)<0) uka.push(e);}); ut.push(k);} });
      ekstra.forEach(function(k){ if(/^feat/.test(k)&&K[k].krit){uka.push(K[k].e);ut.push(k);} });
      uka.sort(function(a,b){return dt(a)-dt(b);});
      ut.forEach(function(k){delete K[k];});
      for(var u=0;u*5<uka.length;u++) K["uka"+(u+1)]={h:listSlide("Denne uka i kirka","Det som skjer de neste åtte dagene","#2b2a30",null,uka.slice(u*5,u*5+5),"",now,true),krit:true};
      orden=["hast"].concat(prioritet).concat(ekstra).concat(Object.keys(K).filter(function(k){return /^uka/.test(k);})).filter(function(k){return K[k];});
      krit=orden.filter(function(k){return K[k].krit;});
    }
    // Fast innhold: en ny misjonssak er alene om plassen i 14 dager
    var fast=FAST.filter(function(f){return !f.utkast&&(!f.until||now<new Date(ymd(f.until).getTime()+864e5));});
    var fresh=!NEWS.utkast&&dayDiff(now,NEWS.published)<=14;
    // Fast innhold med lav prioritet kommer halvparten så ofte som resten
    var vanlig=[NEWS.utkast?"":newsSlide()].concat(fast.filter(function(f){return !f.lav;}).map(function(f){return fastSlide(f,now);})).filter(Boolean);
    var lav=fast.filter(function(f){return f.lav;}).map(function(f){return fastSlide(f,now);}).filter(Boolean);
    var fastPool=fresh?[newsSlide()]:vanlig;
    // Tidskritisk først, så resten etter prioritet. Den siste plassen holdes av til omgang.
    var valgt=krit.slice(), sek=lengde(valgt), faste=maks-1, fasteSek=maksSek-REGLER.sek.vanlig;
    orden.forEach(function(k){
      if(valgt.indexOf(k)<0&&valgt.length<faste&&sek+varighet(K[k].h)<=fasteSek){valgt.push(k);sek+=varighet(K[k].h);}
    });
    // Det som ikke fikk fast plass, går på omgang. Alt kommer like ofte, unntatt fast innhold med lav prioritet,
    // som kommer halvparten så ofte.
    var datert=orden.filter(function(k){return valgt.indexOf(k)<0;}).map(function(k){return K[k].h;});
    var rest=datert.concat(fastPool);
    if(lav.length&&!fresh) rest=rest.concat(rest,lav);
    var fri=Math.max(0,Math.min(maks-valgt.length, Math.floor((maksSek-sek)/REGLER.sek.vanlig))), fyll=[], omgang=[];
    if(rest.length<=fri) fyll=rest;
    else if(fri>0){fyll=rest.slice(0,fri-1);omgang=rest.slice(fri-1);fyll.push(omgang[runde%omgang.length]);}
    // Fast rekkefølge på skjermen
    var vis=["hast","feat1","gud","note1","barn","feat2","mote","feat3","kons"];
    var rekke=vis.filter(function(k){return valgt.indexOf(k)>=0;}).concat(valgt.filter(function(k){return vis.indexOf(k)<0;}).sort(function(a,b){return (/^uka/.test(a)?0:1)-(/^uka/.test(b)?0:1);}));
    var slides=rekke.map(function(k){return K[k].h;}).concat(fyll);
    return {slides:slides,durs:slides.map(varighet),omgang:omgang.length,next:nextText(now),hast:hast(now)};
  }
  function nextText(now){
    var n=E.filter(function(e){return !e.utkast&&!e.erstatter&&dt(e,e.last).getTime()+2*3600e3>now.getTime();}).sort(function(a,b){return dt(a)-dt(b);})[0];
    return n?dShort(dt(n)).toLowerCase()+" kl. "+n.t+"  "+n.title:"Se kirken.no for program";
  }

  // ---- Én bestemt plakat, også utkast. Brukes av forhåndsvisningen i stabsmøtet. ----
  // nøkler: feat:<id> · note:<id> · fast:<id> · nytt · liste:gud|barn|kons|mote
  function slide(key,now){
    var p=key.split(":"), e;
    if(p[0]==="feat"){e=E.filter(function(x){return x.id===p[1];})[0];return e?featSlide(e,now):"";}
    if(p[0]==="note"){e=NOTES.filter(function(x){return x.id===p[1];})[0];return e?noteSlide(e,now):"";}
    if(p[0]==="fast"){e=FAST.filter(function(x){return x.id===p[1];})[0];return e?fastSlide(e,now):"";}
    if(p[0]==="nytt") return newsSlide();
    if(p[0]==="hast"){e=aktivHast(now);return e?hastSlide(e,now):"";}
    if(p[0]==="liste") return lists(now,true).S[p[1]]||"";
    return "";
  }

  // Alle plakatnøkler, for sjekk.js
  function nokler(){
    return E.filter(function(e){return e.feat;}).map(function(e){return "feat:"+e.id;})
      .concat(NOTES.map(function(n){return "note:"+n.id;})).concat(FAST.map(function(f){return "fast:"+f.id;})).concat(["nytt"]).concat(aktivHast(new Date())?["hast"]:[]);
  }

  return {build:build,stilleSide:stilleSide,slide:slide,nextText:nextText,hast:hast,dLong:dLong,nokler:nokler};
})();

</script>
<script>
(function(){
  var stage=document.getElementById("stage"), box=document.getElementById("slides"), dots=document.getElementById("dots");
  var i=0, timer=null, count=0, durs=[], runde=0;
  function show(k){
    if(!count) return;
    i=k;
    var s=box.children, d=dots.children, dur=(durs[i]||8)*1000;
    stage.style.setProperty("--dur",dur+"ms");
    for(var j=0;j<count;j++){s[j].classList.toggle("on",j===i);d[j].className=j<i?"done":"";}
    void d[i].offsetWidth; d[i].className="now";
    clearTimeout(timer);
    timer=setTimeout(function(){ if(i+1>=count){runde++;render();} else show(i+1); },dur);
  }
  // Tegnes på nytt ved starten av hver runde: utløpte plakater forsvinner, og den vekslende plassen går videre
  function render(){
    var now=new Date(), r=Skjerm.build(now,runde);
    // Stillemodus (eller forhåndsvisning med ?stille i adressen): bare lyset og gudstjenestene, ingen runde
    if(r.stille||/[?&]stille/.test(location.search)){
      clearTimeout(timer); stage.classList.add("stillemodus");
      box.innerHTML=r.stille||Skjerm.stilleSide(now);
      timer=setTimeout(render,60*1000); return;
    }
    stage.classList.remove("stillemodus");
    count=r.slides.length; durs=r.durs;
    box.innerHTML=count?r.slides.join(""):'<div class="empty">Ingen kommende arrangementer er lagt inn</div>';
    dots.innerHTML=new Array(count+1).join("<i></i>");
    document.getElementById("next").textContent=r.hast||r.next;
    document.getElementById("lbl").textContent=r.hast?"Viktig beskjed":"Neste i kirka";
    document.querySelector(".foot").classList.toggle("hast",!!r.hast);
    document.getElementById("today").textContent=Skjerm.dLong(now);
    if(count) show(0); else {clearTimeout(timer);timer=setTimeout(render,15*60*1000);}
  }
  render();
})();
</script>
</body>
